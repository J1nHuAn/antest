<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF2F6">
<title>人格动物图鉴</title>
<style>
/* ====== 主题色（改这里即可整体换肤） ====== */
:root{
  --grad-main:linear-gradient(135deg,#FFB6C9 0%,#FF9EC4 48%,#FFA9B8 100%);
  --grad-text:linear-gradient(120deg,#FF9EC4,#FFB98A 55%,#9ED6C0);
  --c-accent:#FF8FB1;
  --c-ink:#4A4453;
  --c-sub:#6F6784;
  --c-mute:#9A90A8;
  --c-line:rgba(180,170,200,.42);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:13.33333vw;}
@media (min-width:750px){html{font-size:100px;}}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#4A4453;
  background:linear-gradient(170deg,#FFF2F6 0%,#F5F8FF 36%,#EFFBF5 68%,#FFF8EF 100%);
  background-attachment:fixed;
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
.app{max-width:750px;margin:0 auto;min-height:100vh;position:relative;}
.page{display:none;padding:.34rem .30rem .7rem;}
.page.active{display:block;animation:fadeUp .38s cubic-bezier(.22,.9,.3,1);}
@keyframes fadeUp{from{opacity:.45;transform:translateY(.16rem)}to{opacity:1;transform:translateY(0)}}

/* ============ 通用按钮 ============ */
.btn-primary{
  display:block;width:100%;border:0;outline:0;
  height:.96rem;border-radius:.48rem;
  font-size:.30rem;font-weight:600;letter-spacing:.02rem;color:#fff;
  background:var(--grad-main);
  box-shadow:0 .1rem .3rem rgba(255,140,175,.36);
  transition:transform .16s ease,box-shadow .16s ease;
}
.btn-primary:active{transform:scale(.97);box-shadow:0 .04rem .16rem rgba(255,140,175,.4);}
.btn-ghost{
  display:block;width:100%;border:0;outline:0;background:transparent;
  height:.86rem;border-radius:.43rem;font-size:.28rem;color:#8A819C;
  border:.02rem solid rgba(180,170,200,.42);
  transition:transform .16s ease,background .16s ease;
}
.btn-ghost:active{transform:scale(.97);background:rgba(255,255,255,.7);}

/* 简版结果页：继续答题（主） / 生成海报（降级为描边） */
.btn-resume{
  display:flex;align-items:center;justify-content:center;gap:.1rem;
  width:100%;border:0;outline:0;
  height:1rem;border-radius:.5rem;
  font-size:.31rem;font-weight:700;letter-spacing:.02rem;color:#fff;font-family:inherit;
  background:linear-gradient(135deg,#FF9EC4 0%,#FF8FB1 52%,#FFA9B8 100%);
  box-shadow:0 .1rem .3rem rgba(255,140,175,.42);
  transition:transform .16s ease,box-shadow .16s ease;
}
.btn-resume:active{transform:scale(.97);box-shadow:0 .04rem .16rem rgba(255,140,175,.45);}
.btn-resume[hidden]{display:none;}
.btn-resume .arrow{font-size:.34rem;line-height:1;opacity:.85;transform:translateY(-.01rem);}
@keyframes resumeIn{from{opacity:.5;transform:translateY(.14rem)}to{opacity:1;transform:translateY(0)}}
.btn-resume:not([hidden]){animation:resumeIn .42s cubic-bezier(.3,.9,.35,1);}
.res-actions.is-free #btnPoster{
  height:.86rem;border-radius:.43rem;
  background:#fff;color:#C2708F;
  border:.02rem solid #FFD7E5;
  box-shadow:0 .06rem .18rem rgba(178,164,204,.16);
  font-size:.27rem;
}

/* ============ 首页 ============ */
#page-welcome{position:relative;padding-top:1.02rem;overflow:hidden;}
.welcome-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.welcome-deco i{position:absolute;border-radius:50%;filter:blur(.05rem);opacity:.55;animation:float 7s ease-in-out infinite;}
.welcome-deco i:nth-child(1){width:2.2rem;height:2.2rem;left:-.6rem;top:.3rem;background:#FFD6E4;}
.welcome-deco i:nth-child(2){width:1.5rem;height:1.5rem;right:-.3rem;top:1.5rem;background:#CFE8FF;animation-delay:1.1s;}
.welcome-deco i:nth-child(3){width:1.7rem;height:1.7rem;right:.8rem;top:-.5rem;background:#DAF3E4;animation-delay:2.2s;}
.welcome-deco i:nth-child(4){width:1.05rem;height:1.05rem;left:.6rem;top:4.5rem;background:#FFE9C4;animation-delay:.6s;}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-.2rem) scale(1.06)}}

.welcome-head{position:relative;z-index:1;text-align:center;}
.welcome-kicker{
  display:inline-block;font-size:.21rem;color:#B08FB8;letter-spacing:.06rem;
  background:rgba(255,255,255,.72);border:.02rem solid rgba(214,190,225,.5);
  padding:.07rem .24rem;border-radius:.3rem;
}
.welcome-title{
  margin-top:.28rem;font-size:.66rem;line-height:1.24;font-weight:800;
  color:#4A4453;letter-spacing:.01rem;
}
.welcome-title em{
  font-style:normal;
  background:var(--grad-text);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.welcome-sub{margin-top:.2rem;font-size:.25rem;color:#948BA4;line-height:1.7;}

.preview-row{display:flex;justify-content:center;align-items:flex-end;gap:.22rem;margin:.5rem 0 .46rem;position:relative;z-index:1;}
.preview-cell{width:1.5rem;height:1.5rem;display:flex;align-items:center;justify-content:center;}
.preview-cell:nth-child(1){animation:bob 4.2s ease-in-out infinite;}
.preview-cell:nth-child(2){width:1.86rem;height:1.86rem;animation:bob 4.2s ease-in-out infinite .5s;}
.preview-cell:nth-child(3){animation:bob 4.2s ease-in-out infinite 1s;}
.preview-cell svg{width:100%;height:100%;display:block;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.11rem)}}

.birth-card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.82);
  border-radius:.28rem;padding:.24rem .26rem;
  box-shadow:0 .06rem .26rem rgba(178,164,204,.14);
  margin-bottom:.34rem;
}
.birth-row{display:flex;align-items:center;justify-content:space-between;}
.birth-label{font-size:.25rem;color:#6F6784;}
.birth-label small{display:block;font-size:.19rem;color:#B3AAC0;margin-top:.05rem;}
.birth-selects{display:flex;gap:.12rem;align-items:center;}
.birth-selects select{
  appearance:none;-webkit-appearance:none;border:0;outline:0;
  background:rgba(255,242,246,.9);
  color:#6F6784;font-size:.24rem;
  height:.58rem;padding:0 .2rem;border-radius:.29rem;
  font-family:inherit;
  background-image:none;
}
.birth-selects span{font-size:.22rem;color:#B3AAC0;}

/* 直接选星座 */
.zodiac-btn{
  width:100%;height:.8rem;margin-top:.2rem;
  display:flex;align-items:center;justify-content:center;gap:.1rem;
  background:#fff;border:.02rem solid #FFD7E5;border-radius:.4rem;
  font-size:.24rem;font-weight:600;color:#C2708F;
  font-family:inherit;cursor:pointer;
  transition:background .2s,border-color .2s,color .2s;
}
.zodiac-btn:active{transform:scale(.985);}
.zodiac-btn .zb-star{color:#FF8FB1;font-size:.26rem;line-height:1;}
.zodiac-btn .zb-arrow{color:#E9C0D2;font-size:.26rem;line-height:1;}
.zodiac-btn.picked{
  background:linear-gradient(135deg,#FFF0F6,#FFE3EF);
  border-color:#FFBED8;color:#B8557E;
}
.zodiac-btn.picked .zb-star{color:#E56A9B;}

/* 星座选择面板 */
.zodiac-layer{position:fixed;inset:0;z-index:800;display:flex;align-items:flex-end;}
.zodiac-layer[hidden]{display:none;}
.zodiac-mask{position:absolute;inset:0;background:rgba(74,68,83,.44);}
.zodiac-sheet{
  position:relative;width:100%;max-width:7.5rem;margin:0 auto;
  background:#FFFBFD;border-radius:.4rem .4rem 0 0;
  padding:.34rem .3rem calc(.28rem + env(safe-area-inset-bottom,0px));
  box-shadow:0 -.08rem .4rem rgba(120,100,140,.2);
  animation:sheetUp .3s cubic-bezier(.22,1,.36,1);
}
@keyframes sheetUp{from{transform:translateY(34%);opacity:.55}to{transform:translateY(0);opacity:1}}
.zs-title{font-size:.32rem;font-weight:800;color:#3F3949;text-align:center;}
.zs-sub{margin-top:.08rem;font-size:.22rem;color:#A79DB6;text-align:center;}
.zs-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.16rem;
  margin-top:.3rem;
}
.zs-item{
  height:1rem;border-radius:.24rem;
  background:#fff;border:.02rem solid #EFE4F3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:inherit;cursor:pointer;padding:0;
  transition:background .18s,border-color .18s;
}
.zs-item i{font-size:.3rem;font-style:normal;color:#C08FD6;line-height:1.1;}
.zs-item span{font-size:.2rem;color:#6F6784;margin-top:.03rem;line-height:1;}
.zs-item.on{background:linear-gradient(135deg,#FFF0F6,#FFE3EF);border-color:#FFBED8;}
.zs-item.on i{color:#FF8FB1;}
.zs-item.on span{color:#B8557E;font-weight:700;}
.zs-actions{margin-top:.26rem;}
.zs-clear{
  width:100%;height:.84rem;border-radius:.42rem;
  background:#fff;border:.02rem solid #E8DDF0;
  font-size:.25rem;color:#8A82A0;font-family:inherit;cursor:pointer;
}

.welcome-foot{position:relative;z-index:1;text-align:center;margin-top:.26rem;font-size:.21rem;color:#B3AAC0;line-height:1.7;}

/* ============ 答题页 ============ */
.quiz-top{display:flex;align-items:center;gap:.2rem;height:.66rem;margin-top:.16rem;}
.icon-btn{
  width:.56rem;height:.56rem;flex:0 0 auto;border:0;outline:0;border-radius:50%;
  background:rgba(255,255,255,.88);
  box-shadow:0 .04rem .16rem rgba(178,164,204,.18);
  font-size:.32rem;line-height:1;color:#8A819C;
  display:flex;align-items:center;justify-content:center;padding-bottom:.04rem;
}
.icon-btn:active{transform:scale(.94);}
.quiz-progress{flex:1;min-width:0;}
.bar{height:.14rem;border-radius:.07rem;background:rgba(255,255,255,.9);overflow:hidden;
  box-shadow:inset 0 0 .02rem rgba(190,178,214,.3);}
.bar>i{
  display:block;height:100%;width:0%;border-radius:.07rem;
  background:linear-gradient(90deg,#FFC6D8,#FFA6C8 55%,#FFB98A);
  transition:width .34s cubic-bezier(.3,.9,.35,1);
}
.quiz-count{margin-top:.09rem;font-size:.2rem;color:#A79DB6;text-align:right;letter-spacing:.02rem;}
.quiz-count b{color:#FF8FB1;font-weight:700;font-size:.22rem;}
/* 简版报告入口：放在导航下方，通栏醒目 */
.quick-wrap{
  margin:.34rem 0 .1rem;
  padding:.28rem .28rem .26rem;
  border-radius:.3rem;
  background:linear-gradient(180deg,#FFF7FB 0%,#FFEDF4 100%);
  border:.015rem solid #FFD7E5;
  box-shadow:0 .1rem .3rem rgba(255,150,190,.14);
  text-align:center;
}
.quick-wrap[hidden]{display:none;}
@keyframes quickIn{from{opacity:.45;transform:translateY(.12rem)}to{opacity:1;transform:translateY(0)}}
.quick-wrap:not([hidden]){animation:quickIn .36s cubic-bezier(.3,.9,.35,1);}
.quick-hint{font-size:.24rem;line-height:1.55;color:#B0728C;letter-spacing:.01rem;}
.quick-btn{
  display:block;width:100%;height:.9rem;margin-top:.22rem;
  border:0;outline:0;border-radius:.45rem;
  background:var(--grad-main);color:#fff;
  font-size:.3rem;font-weight:600;letter-spacing:.02rem;font-family:inherit;
  box-shadow:0 .1rem .24rem rgba(255,140,180,.36);
  transform:translateZ(0);
}
.quick-btn:active{transform:scale(.97);}
.quick-sub{margin-top:.16rem;font-size:.21rem;color:#BAAABF;letter-spacing:.01rem;}

.q-card{
  margin-top:.42rem;
  background:rgba(255,255,255,.92);
  border-radius:.34rem;
  padding:.42rem .34rem .46rem;
  box-shadow:0 .1rem .4rem rgba(178,164,204,.16);
  min-height:2.3rem;
  display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;
}
.q-card::after{
  content:"";position:absolute;width:1.5rem;height:1.5rem;border-radius:50%;
  right:-.5rem;top:-.6rem;background:radial-gradient(circle,rgba(255,214,228,.6),rgba(255,214,228,0) 70%);
}
.q-index{font-size:.2rem;color:#C6B9D8;letter-spacing:.06rem;margin-bottom:.16rem;}
.q-text{font-size:.34rem;line-height:1.6;font-weight:600;color:#4A4453;position:relative;z-index:1;}

.opt-list{margin-top:.3rem;display:flex;flex-direction:column;gap:.17rem;}
.opt{
  display:flex;align-items:center;
  border:0;outline:0;width:100%;text-align:left;
  background:rgba(255,255,255,.82);
  border-radius:.24rem;
  padding:.26rem .26rem;
  font-size:.27rem;color:#5F5872;
  box-shadow:0 .04rem .18rem rgba(178,164,204,.1);
  transition:transform .14s ease,background .18s ease,box-shadow .18s ease,color .18s ease;
  font-family:inherit;
}
.opt .dot{
  width:.34rem;height:.34rem;border-radius:50%;flex:0 0 auto;margin-right:.22rem;
  border:.03rem solid rgba(196,184,216,.55);
  position:relative;transition:all .18s ease;
}
.opt .dot::after{
  content:"";position:absolute;left:50%;top:50%;width:.14rem;height:.14rem;
  border-radius:50%;background:#FF8FB1;transform:translate(-50%,-50%) scale(0);
  transition:transform .18s cubic-bezier(.3,1.4,.5,1);
}
.opt:active{transform:scale(.985);}
.opt.on{
  background:linear-gradient(135deg,rgba(255,236,242,.96),rgba(255,246,238,.96));
  color:#D9678F;font-weight:600;
  box-shadow:0 .06rem .22rem rgba(255,150,185,.26);
}
.opt.on .dot{border-color:#FF9EC4;background:rgba(255,255,255,.9);}
.opt.on .dot::after{transform:translate(-50%,-50%) scale(1);}

.quiz-nav{display:flex;gap:.2rem;margin-top:.42rem;}
.nav-btn{
  flex:1;border:0;outline:0;height:.84rem;border-radius:.42rem;
  font-size:.27rem;font-family:inherit;
  background:rgba(255,255,255,.9);color:#8A819C;
  box-shadow:0 .05rem .18rem rgba(178,164,204,.14);
  transition:transform .14s ease,opacity .2s ease;
}
.nav-btn:active{transform:scale(.97);}
.nav-btn.primary{
  color:#fff;font-weight:600;
  background:var(--grad-main);
  box-shadow:0 .08rem .26rem rgba(255,140,175,.34);
}
.nav-btn[disabled]{opacity:.42;box-shadow:none;}

/* ============ 结果页 ============ */

/* ===== 结果页：海报同款版式 ===== */
.res-top{display:flex;align-items:center;justify-content:space-between;gap:.2rem;margin-top:.06rem;}
.res-title{font-size:.44rem;font-weight:800;color:#3F3949;}
.res-sub{margin-top:.12rem;font-size:.23rem;color:#9A90A8;font-weight:600;}
.res-sub b{color:#4A4453;font-weight:800;}
.res-badge{
  flex:0 0 auto;white-space:nowrap;
  font-size:.2rem;font-weight:700;color:#D2708F;
  background:rgba(255,255,255,.94);
  border:.02rem solid #FFBED8;border-radius:.23rem;
  padding:.1rem .2rem;
  box-shadow:0 .04rem .16rem rgba(255,150,190,.18);
}

.res-duo{display:flex;align-items:flex-start;gap:.3rem;margin-top:.3rem;}
.duo-card{
  flex:0 0 auto;width:calc(50% - .15rem);min-width:0;height:auto;aspect-ratio:1/1;border-radius:.32rem;
  background:rgba(255,255,255,.88);
  border:.02rem solid rgba(255,214,231,.9);
  box-shadow:0 .08rem .3rem rgba(178,164,204,.15);
  position:relative;overflow:hidden;
}
.duo-radar{border-color:rgba(214,226,255,.9);padding:.18rem .1rem .06rem;display:flex;flex-direction:column;}
.radar-title{font-size:.19rem;font-weight:700;color:#8A82A0;padding-left:.14rem;}
.radar-box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
.radar-box svg{width:100%;height:100%;display:block;overflow:visible;}

.ip-stage{transform-origin:50% 88%;}
.ip-stage.pop{animation:ipPop .95s cubic-bezier(.34,1.42,.5,1) 1;}
@keyframes ipPop{
  0%{transform:scale(.38)}
  58%{transform:scale(1.09)}
  80%{transform:scale(.975)}
  100%{transform:scale(1)}
}
.duo-ip .ip-stage{position:absolute;width:auto;height:auto;margin:0;}
.duo-ip .ip-main{left:11%;top:1%;width:66%;height:66%;z-index:2;}
.duo-ip .ip-mini{right:5%;bottom:27%;width:42%;height:42%;z-index:1;}
.duo-tags{position:absolute;left:.14rem;right:.14rem;bottom:.14rem;display:flex;flex-direction:column;gap:.08rem;z-index:3;}
.duo-tag{
  height:.44rem;line-height:.44rem;border-radius:.22rem;
  text-align:center;font-size:.2rem;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 .02rem .1rem rgba(120,100,140,.1);
}

.res-summary{
  margin-top:.3rem;padding:.28rem;
  background:rgba(255,255,255,.9);border-radius:.28rem;
  border:.02rem solid rgba(236,224,246,.95);
  box-shadow:0 .06rem .24rem rgba(178,164,204,.13);
}
.sum-head{
  display:inline-block;
  font-size:.28rem;font-weight:800;color:#D2708F;
  background:#FFF0F6;border-radius:.26rem;
  padding:.11rem .22rem;line-height:1.4;
}
.sum-body{margin-top:.18rem;font-size:.25rem;line-height:1.78;color:#5F5872;}

.res-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:.16rem;margin-top:.28rem;}
.res-pills .pill{
  font-size:.24rem;font-weight:700;
  padding:.1rem .24rem;border-radius:.24rem;
  border:.02rem solid rgba(255,255,255,.92);
  box-shadow:0 .04rem .14rem rgba(178,164,204,.14);
}
.ip-emoji{
  position:absolute;left:50%;bottom:.5rem;font-size:.34rem;pointer-events:none;
  animation:emojiUp .9s ease-out forwards;
}
@keyframes emojiUp{
  0%{opacity:0;transform:translate(-50%,.2rem) scale(.6)}
  30%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-1rem) scale(1.15)}
}

.module-list{margin-top:.34rem;display:flex;flex-direction:column;gap:.18rem;}
.module{
  background:rgba(255,255,255,.88);
  border-radius:.28rem;
  padding:.28rem .28rem .3rem;
  box-shadow:0 .06rem .24rem rgba(178,164,204,.13);
  display:flex;gap:.22rem;
}
.module .m-icon{
  flex:0 0 auto;width:.56rem;height:.56rem;border-radius:.2rem;
  display:flex;align-items:center;justify-content:center;
  font-size:.28rem;
  background:linear-gradient(135deg,#FFE3EC,#EAF3FF);
  color:#E58BAF;
}
.module .m-body{flex:1;min-width:0;}
.module .m-title{font-size:.24rem;font-weight:700;color:#6F6784;letter-spacing:.02rem;}
.module .m-text{margin-top:.1rem;font-size:.25rem;line-height:1.78;color:#5F5872;}

.zodiac-card{
  margin-top:.26rem;
  border-radius:.28rem;padding:.28rem;
  background:linear-gradient(135deg,rgba(255,240,246,.95),rgba(238,247,255,.95));
  border:.02rem dashed rgba(214,190,225,.7);
}
.zodiac-card[hidden]{display:none;}
.zodiac-title{font-size:.23rem;color:#B08FB8;letter-spacing:.06rem;}
.zodiac-main{margin-top:.12rem;font-size:.28rem;font-weight:700;color:#6F6784;}
.zodiac-desc{margin-top:.09rem;font-size:.23rem;color:#9A90A8;line-height:1.7;}

.ver-tip{
  margin-top:.24rem;font-size:.21rem;color:#B3AAC0;text-align:center;line-height:1.7;
}
.ver-tip b{color:#FF9EC4;}

.res-actions{margin-top:.44rem;display:flex;flex-direction:column;gap:.18rem;}

/* ============ 海报层 ============ */
.poster-layer{
  position:fixed;inset:0;z-index:900;display:none;
  align-items:center;justify-content:center;
}
.poster-layer.show{display:flex;}
.poster-mask{position:absolute;inset:0;background:rgba(40,34,54,.72);backdrop-filter:blur(2px);}
.poster-body{
  position:relative;z-index:1;width:84%;max-width:6.3rem;
  max-height:88vh;display:flex;flex-direction:column;align-items:center;gap:.22rem;
  animation:posterIn .3s cubic-bezier(.2,1.2,.4,1);
}
@keyframes posterIn{from{opacity:.5;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.poster-scroll{
  width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-radius:.24rem;
  box-shadow:0 .2rem .6rem rgba(0,0,0,.36);
}
.poster-scroll img{display:block;width:100%;height:auto;border-radius:.24rem;}
.poster-tip{font-size:.24rem;color:#fff;opacity:.92;letter-spacing:.02rem;text-align:center;}
.poster-actions{width:100%;display:flex;gap:.16rem;}
.poster-actions .btn-ghost{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff;}

/* ============ Toast ============ */

function getZodiac(month, day){
  var m = parseInt(month,10), d = parseInt(day,10);
  if(!m || !d || m<1 || m>12 || d<1 || d>31) return null;
  var cur = ZODIAC_STARTS[0];
  for(var i=0;i<ZODIAC_STARTS.length;i++){
    var s = ZODIAC_STARTS[i];
    if(m > s.m || (m === s.m && d >= s.d)) cur = s;
  }
  return zodiacConfig[cur.idx];
}

/* =========================================================
   5. 计分
   ========================================================= */
var DIM_KEYS = ['S','E','StRaw','A','R','PRaw','N','D'];

function countAnswered(map){
  var n = 0;
  for(var i=0;i<questionConfig.length;i++){
    if(map[questionConfig[i].id] != null) n++;
  }
  return n;
}

/* 全部选同一项 → 无效 */
function checkValid(map){
  var vals = [];
  for(var i=0;i<questionConfig.length;i++){
    var v = map[questionConfig[i].id];
    if(v != null) vals.push(v);
  }
  if(vals.length < 3) return false;
  for(var j=1;j<vals.length;j++){
    if(vals[j] !== vals[0]) return true;
  }
  return false;
}

/* 按已答题数归一化，未答不计分（简版不会被拉低） */
function normalize(map){
  var sum = {}, mx = {};
  for(var i=0;i<questionConfig.length;i++){
    var q = questionConfig[i];
    if(q.dim === 'CHECK') continue;
    var a = map[q.id];
    if(a == null) continue;
    var s = q.isReverse ? (6 - a) : a;   /* 1↔5 对称反向 */
    sum[q.dim] = (sum[q.dim] || 0) + s;
    mx[q.dim]  = (mx[q.dim]  || 0) + 5;
  }
  var pct = {};
  for(var k=0;k<DIM_KEYS.length;k++){
    var d = DIM_KEYS[k];
    pct[d] = mx[d] ? Math.round(sum[d] / mx[d] * 100) : 50;
  }
  pct.St = 100 - pct.StRaw;   /* 情绪稳定性 */
  pct.P  = 100 - pct.PRaw;    /* 长期坚持度 */
  return pct;
}

function mapToMbtiAxis(p){
  return {
    E_I: p.E > 50 ? 'E' : 'I',
    S_N: p.N > 50 ? 'N' : 'S',
    T_F: p.S > 50 ? 'F' : 'T',
    J_P: p.D > 50 ? 'J' : 'P'
  };
}

function getMbtiCode(ax){
  return ax.E_I + ax.S_N + ax.T_F + ax.J_P;
}

/* 星座偏移：仅供展示，不参与上面任何判定 */
function applyZodiacDimOffset(p, zod){
  if(!zod || !zod.bias) return p;
  var r = {};
  for(var k in p) r[k] = p[k];
  for(var key in zod.bias){
    if(r[key] == null) continue;
    r[key] = Math.max(0, Math.min(100, r[key] + zod.bias[key]));
  }
  return r;
}

function parseFullText(text){
  var map = {'特质':'trait','优势':'strength','短板':'weakness','事业方向':'career','感情模式':'love'};
  var out = [], lines = String(text).split('\n');
  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;
    var p = line.indexOf('：');
    if(p < 0) continue;
    var key = line.slice(0, p).trim();
    if(!map[key]) continue;
    out.push({key:map[key], title:key, text:line.slice(p+1).trim()});
  }
  return out;
}

function runTest(map, birthMonth, birthDay, zodiacKey){
  if(!checkValid(map)){
    return {ok:false, msg:'答卷无效，请认真作答后重试'};
  }
  var pct = normalize(map);
  var axis = mapToMbtiAxis(pct);
  var code = getMbtiCode(axis);
  var item = null;
  for(var i=0;i<mbtiIpMap.length;i++){
    if(mbtiIpMap[i].code === code){ item = mbtiIpMap[i]; break; }
  }
  if(!item) return {ok:false, msg:'匹配结果异常，请重试'};

  var answered = countAnswered(map);
  var isFreeVersion = answered < 30;

  /* 手选星座优先，没选才用生日推算；两者都不影响 MBTI */
  var zod = null;
  if(zodiacKey != null && zodiacKey >= 0 && zodiacKey < zodiacConfig.length){
    zod = zodiacConfig[zodiacKey];
  }else{
    zod = getZodiac(birthMonth, birthDay);
  }

  var modules = isFreeVersion ? [] : parseFullText(item.fullText);

  return {
    ok:true,
    isFreeVersion:isFreeVersion,
    answered:answered,
    pct:pct,
    mbti:{
      code:item.code, name:item.name,
      mainKey:item.main, subKey:item.sub,
      main:personalityDict[item.main],
      sub:personalityDict[item.sub]
    },
    freeText:item.freeText,
    modules:modules,
    zodiac:zod
  };
}

function clearIpTimers(){
  for(var i=0;i<ipTimers.length;i++) clearTimeout(ipTimers[i]);
  ipTimers = [];
}

function startIpAnimation(stageEl){
  var svg = stageEl.querySelector('svg');
  if(!svg) return;

  var eyes = svg.querySelectorAll('.ip-eye ellipse');
  var mouth = svg.querySelector('.ip-mouth');
  var ears = svg.querySelectorAll('.ip-ear');

  /* 按比例缩放所有眼睛部件，闭眼时高光同步收没，不会留下白点 */
  function setEye(k){
    for(var i=0;i<eyes.length;i++){
      var el = eyes[i];
      if(el.__ry0 == null) el.__ry0 = parseFloat(el.getAttribute('ry')) || 12;
      el.setAttribute('ry', (el.__ry0 * k).toFixed(2));
    }
  }
  function blink(){
    setEye(0.1);
    var t = setTimeout(function(){ setEye(1); }, 130);
    ipTimers.push(t);
    var n = setTimeout(blink, 2600 + Math.random() * 2600);
    ipTimers.push(n);
  }
  var s0 = setTimeout(blink, 1200 + Math.random() * 1500);
  ipTimers.push(s0);

  function wiggle(){
    for(var i=0;i<ears.length;i++){
      (function(el){
        var cx = el.getAttribute('data-cx') || 120;
        var cy = el.getAttribute('data-cy') || 100;
        var dir = (i % 2 === 0) ? 1 : -1;
        var deg = dir * (3.5 + Math.random() * 3);
        el.setAttribute('transform', 'rotate(' + deg + ' ' + cx + ' ' + cy + ')');
        var back = setTimeout(function(){
          el.setAttribute('transform', 'rotate(0 ' + cx + ' ' + cy + ')');
        }, 520);
        ipTimers.push(back);
      })(ears[i]);
    }
    var n = setTimeout(wiggle, 2200 + Math.random() * 1800);
    ipTimers.push(n);
  }
  var s1 = setTimeout(wiggle, 900);
  ipTimers.push(s1);

  return {mouth: mouth};
}

var OPTIONS = [
  {val:1, label:'非常不符合'},
  {val:2, label:'不太符合'},
  {val:3, label:'一般'},
  {val:4, label:'比较符合'},
  {val:5, label:'非常符合'}
];

function renderQuestion(){
  var q = questionConfig[state.index];
  var qIndex = state.index;
  var answered = countAnswered(state.answers);

  $('qcount').textContent = (state.index + 1);
  $('qidx').textContent = (state.index + 1 < 10 ? '0' : '') + (state.index + 1);
  $('qtext').textContent = q.text;
  $('pbar').style.width = Math.round(answered / 30 * 100) + '%';

  var box = $('optList');
  box.innerHTML = '';
  for(var i=0;i<OPTIONS.length;i++){
    (function(o){
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      if(state.answers[q.id] === o.val) b.className = 'opt on';
      b.innerHTML = '<span class="dot"></span><span>'+o.label+'</span>';
      b.onclick = function(){ choose(o.val, qIndex); };
      box.appendChild(b);
    })(OPTIONS[i]);
  }

  $('btnPrev').disabled = (state.index === 0);
  var isLast = (state.index === questionConfig.length - 1);
  $('btnNext').textContent = isLast ? '查看完整报告' : '下一题';

  var showQuick = (answered >= 12 && answered < 30);
  $('quickWrap').hidden = !showQuick;
}

function clearAdvTimer(){
  if(state.advTimer){
    clearTimeout(state.advTimer);
    state.advTimer = null;
  }
}

function choose(val, at){
  /* 迟到的点击：选项已过期（页面已翻到下一题），直接丢弃，避免错题写入 + 跳题 */
  if(at != null && at !== state.index) return;

  var q = questionConfig[state.index];
  state.answers[q.id] = val;

  var opts = $('optList').children;
  for(var i=0;i<opts.length;i++) opts[i].classList.remove('on');
  if(opts[val - 1]) opts[val - 1].classList.add('on');

  $('pbar').style.width = Math.round(countAnswered(state.answers) / 30 * 100) + '%';

  /* 连点保护：先撤销上一次排队的前进，保证一次答题只前进一格 */
  clearAdvTimer();

  var isLast = (state.index === questionConfig.length - 1);
  var fromIndex = state.index;
  state.advTimer = setTimeout(function(){
    state.advTimer = null;
    /* 排队期间被其他入口翻页了，本次前进作废 */
    if(state.index !== fromIndex) return;
    if(isLast) { tryShowResult(true); }
    else { state.index++; renderQuestion(); }
  }, 260);
}

function goNext(){
  clearAdvTimer();
  var q = questionConfig[state.index];
  if(state.answers[q.id] == null){
    toast('先选一个答案喵～');
    return;
  }
  if(state.index === questionConfig.length - 1){
    tryShowResult(true);
  }else{
    state.index++;
    renderQuestion();
  }
}

function goPrev(){
  clearAdvTimer();
  if(state.index === 0) return;
  state.index--;
  renderQuestion();
}

  clearAdvTimer();
  state.index = 0;
  state.answers = {};
  state.birthMonth = $('birthMonth').value;
  state.birthDay = $('birthDay').value;
  renderQuestion();
  showPage('page-quiz');
};

function tryShowResult(isFinal){
  clearAdvTimer();
  var answered = countAnswered(state.answers);

  if(answered < 12){
    toast('至少答完 12 题才能生成报告喵～');
    return;
  }

  var res = runTest(state.answers, state.birthMonth, state.birthDay, state.zodiacKey);

  if(!res.ok){
    toast(res.msg || '答卷无效');
    /* 无效答卷：回到第一题重答 */
    state.index = 0;
    state.answers = {};
    renderQuestion();
    showPage('page-quiz');
    return;
  }

  lastResult = res;
  renderResult(res);
  showPage('page-result');
}

/* IP 点击互动 */
function bindIpClick(el){
  el.addEventListener('click', function(){
    var svg = el.querySelector('svg');
    if(!svg) return;
    var mouth = svg.querySelector('.ip-mouth');
    var eyes = svg.querySelectorAll('.ip-eye ellipse');
    var face = ['M107 161 q13 12 26 0', 'M106 158 q14 18 28 0', 'M108 163 q12 6 24 0'];
    var cur = mouth.getAttribute('d');
    var next = face[0];
    for(var i=0;i<face.length;i++){
      if(face[i] === cur){ next = face[(i + 1) % face.length]; break; }
    }
    mouth.setAttribute('d', next);
    for(var j=0;j<eyes.length;j++) eyes[j].setAttribute('ry', '9');
    setTimeout(function(){
      for(var j=0;j<eyes.length;j++) eyes[j].setAttribute('ry', '12.5');
    }, 420);

    var key = null;
    if(lastResult){
      key = (el.id === 'ipMain') ? lastResult.mbti.mainKey : lastResult.mbti.subKey;
    }
    var s = IP_STYLE[key] || IP_STYLE.cat;
    var span = document.createElement('div');
    span.className = 'ip-emoji';
    span.textContent = s.emoji;
    el.parentNode.appendChild(span);
    setTimeout(function(){
      if(span.parentNode) span.parentNode.removeChild(span);
    }, 950);
  });
}

   ========================================================= */
var FF_CN = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxW, lh){
  var line = '';
  for(var i=0;i<text.length;i++){
    var ch = text.charAt(i);
    if(ctx.measureText(line + ch).width > maxW && line){
      ctx.fillText(line, x, y);
      y += lh;
      line = ch;
    }else{
      line += ch;
    }
  }
  if(line){ ctx.fillText(line, x, y); y += lh; }
  return y;
}

function drawAvatar(ctx, key, cx, cy, r){
  var s = IP_STYLE[key] || IP_STYLE.cat;
  var F = s.fur, F2 = s.fur2, E = s.ear, B = s.blush, L = s.line || F2;
  var lw = Math.max(2, r * 0.05);
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  /* 落地阴影 */
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 1.04, r * 0.74, r * 0.1, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(140,120,170,.15)';
  ctx.fill();

  /* ---------- 耳朵 ---------- */
  ctx.fillStyle = F;
  ctx.strokeStyle = L;
  ctx.lineWidth = lw;

  function earTri(ax, ay, bx, by, px, py, ibx, iby, ipx, ipy){
    ctx.beginPath();
    ctx.moveTo(cx + ax * r, cy + ay * r);
    ctx.lineTo(cx + bx * r, cy + by * r);
    ctx.lineTo(cx + px * r, cy + py * r);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + ibx * r, cy + iby * r);
    ctx.lineTo(cx + ipx * r, cy + ipy * r);
    ctx.lineTo(cx + bx * r * 0.86, cy + by * r * 0.92);
    ctx.closePath();
    ctx.globalAlpha = 0.5; ctx.fillStyle = E; ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = F;
  }

  if(s.kind === 'point' || s.kind === 'point-tall'){
    var tall = (s.kind === 'point-tall');
    var ty = tall ? -1.44 : -1.29;
    var tx = tall ? -0.88 : -0.825;
    earTri(-0.325, -0.737, -0.65, -0.437, tx, ty, -0.20, -0.74, tx + 0.10, ty + 0.16);
    earTri( 0.325, -0.737,  0.65, -0.437, -tx, ty,  0.20, -0.74, -(tx + 0.10), ty + 0.16);
  } else if(s.kind === 'round' || s.kind === 'biground'){
    var big = (s.kind === 'biground');
    var er = big ? r * 0.56 : r * 0.4;
    var ex = big ? r * 1.02 : r * 0.7;
    var ey = big ? -r * 0.36 : -r * 0.74;
    var lx = cx - ex, rx2 = cx + ex, ly = cy + ey;
    ctx.beginPath(); ctx.arc(lx, ly, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(rx2, ly, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 0.4; ctx.fillStyle = E;
    ctx.beginPath(); ctx.arc(lx, ly, er * 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(rx2, ly, er * 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = F;
  } else if(s.kind === 'drop'){
    ctx.beginPath(); ctx.ellipse(cx - r * 0.72, cy - r * 0.16, r * 0.34, r * 0.6, -0.16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx + r * 0.72, cy - r * 0.16, r * 0.34, r * 0.6,  0.16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 0.35; ctx.fillStyle = E;
    ctx.beginPath(); ctx.ellipse(cx - r * 0.72, cy - r * 0.1, r * 0.18, r * 0.38, -0.16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r * 0.72, cy - r * 0.1, r * 0.18, r * 0.38,  0.16, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = F;
  } else if(s.kind === 'fluff'){

function dimView(key){

  return DIM_VIEW[0];
}

/* 取偏离中位最多的 2 高 + 2 低，保证正负都有 */
function pickPills(pct){
  var arr = [];
  for(var i=0;i<DIM_VIEW.length;i++){
    var d = DIM_VIEW[i];
    var v = (pct && pct[d.key] != null) ? pct[d.key] : 50;
    arr.push({d:d, v:v, dev:Math.abs(v-50)});
  }
  var hi = [], lo = [];
  for(var a=0;a<arr.length;a++){ (arr[a].v >= 50 ? hi : lo).push(arr[a]); }
  hi.sort(function(x,y){ return y.dev - x.dev; });
  lo.sort(function(x,y){ return y.dev - x.dev; });
  var picked = hi.slice(0,2).concat(lo.slice(0,2));
  if(picked.length < 4){
    var rest = arr.slice().sort(function(x,y){ return y.dev - x.dev; });
    for(var b=0;b<rest.length && picked.length<4;b++){
      if(picked.indexOf(rest[b]) < 0) picked.push(rest[b]);
    }
  }
  var out = [];
  for(var c=0;c<picked.length;c++){
    var it = picked[c];
    out.push({text: it.v >= 50 ? it.d.hi : it.d.lo, bg: it.d.bg, fg: it.d.fg, dev: it.dev});
  }
  out.sort(function(x,y){ return y.dev - x.dev; });
  return out;
}

function firstClauses(desc, n){
  var parts = String(desc || '').split('，');
  var out = [];
  for(var i=0;i<parts.length && out.length<n;i++){
    var s = parts[i].trim();
    if(s) out.push(s);
  }
  return out.join('、');
}

function measureWrap(ctx, text, maxW, lh){
  var line = '', lines = 0;
  for(var i=0;i<text.length;i++){
    var ch = text.charAt(i);
    if(ctx.measureText(line + ch).width > maxW && line){ lines++; line = ch; }
    else line += ch;
  }
  if(line) lines++;
  return lines * lh;
}

/* 六芒星雷达图 */
function drawRadar(ctx, cx, cy, R, items){
  var n = items.length;
  var step = Math.PI * 2 / n;
  var start = -Math.PI / 2;
  var i, a, x, y;

  /* 同心六边形网格 */
  for(var ring=1; ring<=4; ring++){
    var rr = R * ring / 4;
    ctx.beginPath();
    for(i=0;i<n;i++){
      a = start + step * i;
      x = cx + Math.cos(a) * rr;
      y = cy + Math.sin(a) * rr;
      if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    if(ring === 4){
      ctx.fillStyle = 'rgba(252,248,255,.9)'; ctx.fill();
      ctx.strokeStyle = 'rgba(186,174,210,.62)'; ctx.lineWidth = 2;
    }else{
      ctx.strokeStyle = 'rgba(208,200,226,.45)'; ctx.lineWidth = 1.4;
    }
    ctx.stroke();
  }

  /* 轴线 */
  for(i=0;i<n;i++){
    a = start + step * i;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.strokeStyle = 'rgba(208,200,226,.55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  /* 数据面 */
  var pts = [];
  for(i=0;i<n;i++){
    a = start + step * i;
    var v = Math.max(8, Math.min(100, items[i].val)) / 100;
    pts.push([cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]);
  }

  ctx.beginPath();
  for(i=0;i<pts.length;i++){
    if(i===0) ctx.moveTo(pts[i][0], pts[i][1]);
    else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.closePath();

  var rgd = ctx.createRadialGradient(cx, cy, 8, cx, cy, R);
  rgd.addColorStop(0, 'rgba(255,150,182,.62)');
  rgd.addColorStop(0.6, 'rgba(220,160,210,.48)');
  rgd.addColorStop(1, 'rgba(169,139,216,.46)');
  ctx.fillStyle = rgd;
  ctx.fill();
  ctx.strokeStyle = '#FF8FB1';
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.stroke();

  /* 顶点小圆 */
  for(i=0;i<pts.length;i++){
    ctx.beginPath();
    ctx.arc(pts[i][0], pts[i][1], 5.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = items[i].color || '#FF8FB1';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  /* 轴标签：名称 + 数值 */
  var oldBase = ctx.textBaseline;
  ctx.textBaseline = 'middle';
  for(i=0;i<n;i++){
    a = start + step * i;
    var lx = cx + Math.cos(a) * (R + 32);
    var ly = cy + Math.sin(a) * (R + 32);
    ctx.textAlign = 'center';
    ctx.font = '600 17px ' + FF_CN;
    ctx.fillStyle = '#7C7490';
    ctx.fillText(items[i].label, lx, ly - 10);
    ctx.font = '800 18px ' + FF_CN;
    ctx.fillStyle = items[i].color || '#D2708F';
    ctx.fillText(items[i].val + '', lx, ly + 11);
  }
  ctx.textBaseline = oldBase || 'alphabetic';
}

/* 页面内 SVG 六芒星：与 Canvas 版 drawRadar 同款视觉 */
function buildRadarSvg(items){

  if(!n) return '';

  var step = Math.PI * 2 / n, start = -Math.PI / 2;
  var i, a, rr, x, y, ring, pts, v, dp, dots = '', s = '';

  s += '<svg viewBox="0 0 ' + S + ' ' + S + '" xmlns="http://www.w3.org/2000/svg">';

  /* 4 圈同心六边形网格 */
  for(ring = 1; ring <= 4; ring++){
    rr = R * ring / 4;
    pts = [];
    for(i = 0; i < n; i++){
      a = start + step * i;
      pts.push((cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1));
    }
    if(ring === 4){
      s += '<polygon points="' + pts.join(' ') + '" fill="rgba(252,248,255,.9)" stroke="rgba(186,174,210,.62)" stroke-width="2"/>';
    }else{
      s += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="rgba(208,200,226,.45)" stroke-width="1.4"/>';
    }
  }

  /* 轴线 */
  for(i = 0; i < n; i++){
    a = start + step * i;
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(a) * R).toFixed(1) +
         '" y2="' + (cy + Math.sin(a) * R).toFixed(1) + '" stroke="rgba(208,200,226,.55)" stroke-width="1.4"/>';
  }

  /* 数据面顶点 */
  dp = [];
  for(i = 0; i < n; i++){
    a = start + step * i;
    v = Math.max(8, Math.min(100, items[i].val)) / 100;
    x = cx + Math.cos(a) * R * v;

            (items[i].color || '#FF8FB1') + '" stroke-width="3"/>';
  }

  s += '<defs><radialGradient id="radarFill" cx="50%" cy="50%" r="50%">' +
       '<stop offset="0%" stop-color="rgba(255,150,182,.62)"/>' +
       '<stop offset="60%" stop-color="rgba(220,160,210,.48)"/>' +
       '<stop offset="100%" stop-color="rgba(169,139,216,.46)"/>' +
       '</radialGradient></defs>';

  s += '<polygon points="' + dp.join(' ') + '" fill="url(#radarFill)" stroke="#FF8FB1" stroke-width="3" stroke-linejoin="round"/>';
  s += dots;

  /* 轴标签：名称 + 数值 */
  for(i = 0; i < n; i++){
    a = start + step * i;
    x = cx + Math.cos(a) * LR;
    y = cy + Math.sin(a) * LR;
    s += '<text x="' + x.toFixed(1) + '" y="' + (y - 6).toFixed(1) +
         '" text-anchor="middle" font-size="17" font-weight="600" fill="#7C7490">' + items[i].label + '</text>';
    s += '<text x="' + x.toFixed(1) + '" y="' + (y + 15).toFixed(1) +
         '" text-anchor="middle" font-size="18" font-weight="800" fill="' + (items[i].color || '#D2708F') + '">' +
         items[i].val + '</text>';
  }

  s += '</svg>';
  return s;
}

  var g = ctx.createLinearGradient(0, 0, W, 3200);
  g.addColorStop(0, '#FFF2F7');
  g.addColorStop(0.38, '#F7F4FF');
  g.addColorStop(1, '#EFFAF6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 3200);

  var rg = ctx.createRadialGradient(W*0.16, 90, 10, W*0.16, 90, 460);
  rg.addColorStop(0, 'rgba(255,205,224,.60)');
  rg.addColorStop(1, 'rgba(255,205,224,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, 700);

  var rg2 = ctx.createRadialGradient(W*0.88, 300, 10, W*0.88, 300, 400);
  rg2.addColorStop(0, 'rgba(198,228,255,.55)');
  rg2.addColorStop(1, 'rgba(198,228,255,0)');
  ctx.fillStyle = rg2; ctx.fillRect(0, 0, W, 780);

  /* ---- 顶部标题 ---- */
  ctx.textAlign = 'left';
  ctx.fillStyle = '#3F3949';
  ctx.font = '800 46px ' + FF_CN;
  ctx.fillText('观己人格报告', PAD, 106);

  ctx.fillStyle = '#9A90A8';
  ctx.font = '600 24px ' + FF_CN;
  ctx.fillText('MBTI · ' + res.mbti.code + ' ' + res.mbti.name, PAD, 152);

  /* 右上气泡：夹在标题与小字之间 */
  var bubble = '主副双人格完整版';
  ctx.font = '600 22px ' + FF_CN;
  var bw = ctx.measureText(bubble).width + 46;
  var bh = 46;
  var bxb = W - PAD - bw, byb = 129 - bh / 2;
  roundRect(ctx, bxb, byb, bw, bh, bh/2);
  ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,190,216,.95)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#D2708F';
  ctx.textAlign = 'center';
  ctx.fillText(bubble, bxb + bw/2, byb + bh/2 + 8);

  /* ---- 两个正方形框 ---- */
  var boxY = 198, boxS = 312, bGap = innerW - boxS * 2;
  var b1 = PAD, b2 = PAD + boxS + bGap;

  /* 左：拟人动物 + 主副人格标签 */
  roundRect(ctx, b1, boxY, boxS, boxS, 32);
  ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,214,231,.90)'; ctx.lineWidth = 2; ctx.stroke();

  drawAvatar(ctx, res.mbti.mainKey, b1 + boxS/2, boxY + 110, 78);

  var st1 = IP_STYLE[res.mbti.mainKey] || IP_STYLE.cat;
  var st2 = IP_STYLE[res.mbti.subKey] || IP_STYLE.cat;

  function tagRow(ty, text, bg, fg){
    roundRect(ctx, b1 + 22, ty, boxS - 44, 42, 21);
    ctx.fillStyle = bg; ctx.fill();
    ctx.fillStyle = fg;
    ctx.textAlign = 'center';
    ctx.font = '700 22px ' + FF_CN;
    ctx.fillText(text, b1 + boxS/2, ty + 28);
  }
  tagRow(boxY + 200, '主人格 · ' + res.mbti.main.name, st1.fur, '#6E5460');
  tagRow(boxY + 250, '副人格 · ' + res.mbti.sub.name, st2.fur2, '#5E4E62');

  /* 右：六芒星维度图 */
  roundRect(ctx, b2, boxY, boxS, boxS, 32);
  ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fill();
  ctx.strokeStyle = 'rgba(214,226,255,.90)'; ctx.stroke();

  ctx.textAlign = 'left';
  ctx.fillStyle = '#8A82A0';
  ctx.font = '700 20px ' + FF_CN;
  ctx.fillText('人格维度', b2 + 24, boxY + 36);

  var radarItems = [];
  for(var i=0;i<POSTER_BAR_DIMS.length;i++){
    var dv = dimView(POSTER_BAR_DIMS[i]);
    radarItems.push({
      label: dv.label,
      val: (res.pct && res.pct[dv.key] != null) ? res.pct[dv.key] : 50,
      color: dv.bar
    });
  }

  drawRadar(ctx, b2 + boxS/2, boxY + 180, 74, radarItems);

  /* ---- 性格总结 ---- */
  var head = POSTER_HEADLINE[res.mbti.code] || ('你是' + res.mbti.name);
  var lineA = firstClauses(res.mbti.main.desc, 2);
  var lineB = firstClauses(res.mbti.sub.desc, 2);
  var body = lineA + '，也' + lineB + '。';

  var cardX = PAD, cardW = innerW, ipd = 32;
  var cardY = boxY + boxS + 30;

  ctx.font = '400 25px ' + FF_CN;
  var bodyH = measureWrap(ctx, body, cardW - ipd * 2, 42);
  var headH = 54;
  var cardH = ipd + headH + 20 + bodyH + 30;

  roundRect(ctx, cardX, cardY, cardW, cardH, 28);
  ctx.fillStyle = 'rgba(255,255,255,.90)'; ctx.fill();
  ctx.strokeStyle = 'rgba(236,224,246,.95)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.textAlign = 'left';
  ctx.font = '800 30px ' + FF_CN;
  var hw = ctx.measureText(head).width + 44;
  if(hw > cardW - ipd * 2) hw = cardW - ipd * 2;
  roundRect(ctx, cardX + ipd, cardY + ipd, hw, headH, 27);
  ctx.fillStyle = '#FFF0F6'; ctx.fill();

  ctx.fillStyle = '#D2708F';
  ctx.fillText(head, cardX + ipd + 22, cardY + ipd + 37);

  ctx.fillStyle = '#5F5872';
  ctx.font = '400 25px ' + FF_CN;
  wrapText(ctx, body, cardX + ipd, cardY + ipd + headH + 20 + 30, cardW - ipd * 2, 42);

  /* ---- 关键词胶囊 ---- */
  var pills = pickPills(res.pct);
  var py2 = cardY + cardH + 30;
  var pillH = 48, pgap = 16;

  ctx.font = '700 24px ' + FF_CN;
  var widths = [], totalW = 0;
  for(var p=0;p<pills.length;p++){
    var tw = ctx.measureText(pills[p].text).width + 46;
    widths.push(tw); totalW += tw;
  }
  totalW += pgap * Math.max(0, pills.length - 1);

  var pcx = W/2 - totalW/2;
  for(var q=0;q<pills.length;q++){
    roundRect(ctx, pcx, py2, widths[q], pillH, pillH/2);
    ctx.fillStyle = pills[q].bg; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.90)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = '700 24px ' + FF_CN;
    ctx.fillStyle = pills[q].fg;
    ctx.fillText(pills[q].text, pcx + widths[q]/2, py2 + 32);
    pcx += widths[q] + pgap;
  }

  y = py2 + pillH + 40;

  /* ---- 完整版五个模块 ---- */
  var mods = res.isFreeVersion ? [] : res.modules;
  ctx.textAlign = 'left';

  for(var mi=0;mi<mods.length;mi++){
    var m = mods[mi];
    ctx.fillStyle = '#D2708F';
    ctx.font = '700 26px ' + FF_CN;
    ctx.fillText(m.title, PAD, y);

    ctx.fillStyle = 'rgba(255,190,216,.80)';
    roundRect(ctx, PAD, y + 10, 52, 5, 3); ctx.fill();
    y += 44;

    ctx.fillStyle = '#5F5872';
    ctx.font = '400 25px ' + FF_CN;
    y = wrapText(ctx, m.text, PAD, y, innerW, 42);
    y += 18;
  }

  /* ---- 星座 ---- */
  if(res.zodiac){
    y += 12;
    roundRect(ctx, PAD, y - 26, innerW, 132, 26);
    ctx.fillStyle = 'rgba(255,244,249,.92)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,214,231,.85)'; ctx.lineWidth = 2; ctx.stroke();

    ctx.textAlign = 'left';
    ctx.fillStyle = '#B08FB8';
    ctx.font = '500 21px ' + FF_CN;
    ctx.fillText('星座趣味参考', PAD + 28, y + 16);

    ctx.fillStyle = '#6F6784';
    ctx.font = '700 27px ' + FF_CN;
    ctx.fillText(res.zodiac.name + ' · ' + res.zodiac.desc, PAD + 28, y + 60);
    y += 132;
  }

  /* ---- 底部 ---- */
  y += 36;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#B8A9C7';
  ctx.font = '500 23px ' + FF_CN;
  ctx.fillText('长按保存 · 测测你心里住着哪只小动物', W/2, y);
  y += 52;

  /* ---- 裁剪 ---- */
  var usedH = Math.min(Math.ceil(y), 3200);
  var OUT = document.createElement('canvas');
  OUT.width = W;
  OUT.height = usedH;
  OUT.getContext('2d').drawImage(C, 0, 0, W, usedH, 0, 0, W, usedH);
  return OUT;
}

$('btnPoster').onclick = function(){
  if(!lastResult){ toast('请先完成测试喵～'); return; }
  try{
    var cv = buildPoster(lastResult);
    var url = cv.toDataURL('image/jpeg', 0.94);
    var box = $('posterScroll');
    box.innerHTML = '';
    var img = new Image();
    img.onload = function(){
      $('posterLayer').classList.add('show');
    };
    img.src = url;
    box.appendChild(img);
  }catch(e){
    toast('海报生成失败，请重试');
  }
};

$('btnClosePoster').onclick = function(){
  $('posterLayer').classList.remove('show');
};
$('posterMask').onclick = function(){
  $('posterLayer').classList.remove('show');
};

/* 首次进入 */
renderQuestion();

/* 调试出口（可删，不影响功能） */
window.__ZOO__ = {
  runTest:runTest, normalize:normalize, getZodiac:getZodiac, checkValid:checkValid,
  questionConfig:questionConfig, mbtiIpMap:mbtiIpMap, buildIpSvg:buildIpSvg,
  buildPoster:buildPoster, pickPills:pickPills,
  state:function(){ return state; }
};

})();
</script>
